# Keeps the "Writing" list in README.md in step with the blog's RSS feed.
name: Latest blog posts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://oliverz.dev/rss.xml'
          max_post_count: 4
          commit_message: 'Update the latest blog posts'
